include: package:flutter_lints/flutter.yaml

linter:
  rules:

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

plugins:
  riverpod_lint:
    version: ^3.1.8
    diagnostics:
      scoped_providers_should_specify_dependencies: false