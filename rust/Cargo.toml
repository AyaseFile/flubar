[package]
name = "rust_lib_flubar"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
anyhow = "1.0.104"
lofty = "0.25.1"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "build", "static"] }
infer = "0.22.0"
cue = { git = "https://github.com/AyaseFile/libcue.rs" }

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
