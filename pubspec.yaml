name: flubar
description: "audio helper written in flutter"
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  talker_flutter: ^5.1.16
  get: ^4.7.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  fast_immutable_collections: ^11.2.0
  riverpod: ^3.4.2
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  multi_split_view: ^3.6.2
  material_table_view: ^5.5.2
  window_manager: ^0.5.2
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.4.2
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_settings_ui: ^3.0.1
  super_drag_and_drop: ^0.9.1
  super_clipboard: ^0.9.1
  file_picker: ^11.0.3
  collection: ^1.19.1
  super_context_menu: ^0.9.1
  just_audio: ^0.10.6
  just_audio_media_kit:
    git:
      url: https://github.com/AyaseFile/just_audio_media_kit.git
      ref: 05f3587
  media_kit_libs_linux: ^1.2.1
  media_kit_native_event_loop: ^1.0.9
  rust_lib_flubar:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  window_size:
    git:
      url: https://github.com/google/flutter-desktop-embedding.git
      path: plugins/window_size
  hive: ^2.2.3
  unorm_dart: ^0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.8
  riverpod_lint: ^3.1.8
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true